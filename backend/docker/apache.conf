ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/synccampus/public

    <Directory /var/www/synccampus/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Every request that is not a real file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # Apache drops the Authorization header for PHP unless it is passed on explicitly.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
