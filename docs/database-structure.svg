<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1640" viewBox="0 0 1800 1640" role="img" aria-labelledby="title desc">
<title id="title">SyncCampus database structure</title>
<desc id="desc">Entity relationship diagram of the SyncCampus database, showing its eighteen core tables and their foreign-key relationships.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9ba9ba"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#18243a}.title{font-size:38px;font-weight:750;letter-spacing:-.5px}.sub{font-size:17px;fill:#52627a}.zone{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#6c7890}.card{fill:#fff;stroke:#d9e0ea;stroke-width:1.5;rx:13}.head{fill:#f1f5fa}.thead{font-size:18px;font-weight:700}.field{font-size:13.5px;fill:#334155}.key{font-weight:700;fill:#7a1426}.line{fill:none;stroke:#aab5c3;stroke-width:2;marker-end:url(#arrow)}.rel{font-size:12px;fill:#66758a}.note{font-size:13px;fill:#637086}
  </style>
</defs>
<rect width="1800" height="1640" fill="#f7f8fb"/>
<text x="64" y="68" class="title">SyncCampus database structure</text>
<text x="64" y="101" class="sub">Entity relationship diagram · MySQL / PostgreSQL schema · primary keys (PK) and foreign keys (FK)</text>
<rect x="64" y="126" width="1672" height="1" fill="#dfe4ec"/>
<text x="64" y="162" class="zone">CONCERN MANAGEMENT</text><text x="624" y="162" class="zone">STAFF &amp; GOVERNANCE</text><text x="1184" y="162" class="zone">GUILD WORKSPACE &amp; FEEDBACK</text>

<!-- Relationship connectors are behind the table cards. -->
<g class="line">
 <path d="M270 376 V400"/><!-- categories to concerns -->
 <path d="M484 720 H548 V500 H484"/><!-- related groups to concerns -->
 <path d="M484 500 H512 V950 H484"/><path d="M484 500 H526 V1170 H484"/><path d="M484 500 H540 V1390 H484"/><!-- concerns to their history -->
 <path d="M835 376 V400"/><!-- users to delegates -->
 <path d="M1044 280 H1060 V700 H1044"/><path d="M1044 280 H1076 V920 H1044"/><path d="M1044 280 H1092 V1140 H1044"/><path d="M1044 280 H1108 V1360 H1044"/><!-- user audit, invitation, handover and messages -->
 <path d="M1395 376 V400"/><!-- workspace items to tasks -->
 <path d="M1395 816 V840"/><!-- suggestions to updates -->
 <path d="M1395 1256 V1280"/><!-- surveys to responses -->
</g>

<!-- Concern management -->
<g transform="translate(64 196)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">categories</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan></text><text x="18" y="92" class="field">name · base_severity · is_sensitive</text></g>
<g transform="translate(64 416)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">concerns</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  category_id</tspan></text><text x="18" y="92" class="field"><tspan class="key">FK</tspan><tspan>  group_id → related_groups.id</tspan></text><text x="18" y="115" class="field">reference (unique) · title · description</text><text x="18" y="138" class="field">status · priority · created_at</text></g>
<g transform="translate(64 636)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">related_groups</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan></text><text x="18" y="92" class="field">master_concern_id · reports_count</text><text x="18" y="115" class="note">master_concern_id is stored as an integer;</text><text x="18" y="136" class="note">the model does not declare it as a foreign key.</text></g>
<g transform="translate(64 856)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">concern_updates</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  concern_id</tspan></text><text x="18" y="92" class="field"><tspan class="key">FK</tspan><tspan>  author_user_id (nullable)</tspan></text><text x="18" y="115" class="field">author_label · visibility · message</text><text x="18" y="138" class="field">created_at</text></g>
<g transform="translate(64 1076)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">assignments</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  concern_id</tspan></text><text x="18" y="92" class="field"><tspan class="key">FK</tspan><tspan>  delegate_id · assigned_by</tspan></text><text x="18" y="115" class="field">recommended_score · status · assigned_at</text></g>
<g transform="translate(64 1296)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">escalation_events</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  concern_id</tspan></text><text x="18" y="92" class="field">type · reason · triggered_at</text><text x="18" y="115" class="field">acknowledged_at</text></g>

<!-- Staff and governance -->
<g transform="translate(624 196)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">users</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan></text><text x="18" y="92" class="field">full_name · email (unique) · password_hash</text><text x="18" y="115" class="field">role · is_active · created_at</text></g>
<g transform="translate(624 416)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">delegates</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  user_id (unique)</tspan></text><text x="18" y="92" class="field">portfolio · categories_handled</text><text x="18" y="115" class="field">max_open_load · is_available · show_public</text></g>
<g transform="translate(624 636)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">staff_invitations</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  created_by</tspan></text><text x="18" y="92" class="field">token_hash (unique) · role · invitee_email</text><text x="18" y="115" class="field">created_at · expires_at · redeemed_at</text></g>
<g transform="translate(624 856)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">audit_log</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  user_id (nullable)</tspan></text><text x="18" y="92" class="field">action · entity · entity_id</text><text x="18" y="115" class="field">created_at</text></g>
<g transform="translate(624 1076)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">handover_records</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  generated_by</tspan></text><text x="18" y="92" class="field">term_label · snapshot (JSON text)</text><text x="18" y="115" class="field">generated_at</text></g>
<g transform="translate(624 1296)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">internal_messages</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  author_user_id</tspan></text><text x="18" y="92" class="field">message · created_at</text></g>

<!-- Workspace and feedback -->
<g transform="translate(1184 196)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">workspace_items</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  created_by</tspan></text><text x="18" y="92" class="field">kind · title · description · status</text><text x="18" y="115" class="field">visibility · dates · location · url</text></g>
<g transform="translate(1184 416)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">project_tasks</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  project_id</tspan></text><text x="18" y="92" class="field"><tspan class="key">FK</tspan><tspan>  assigned_to_user_id · created_by</tspan></text><text x="18" y="115" class="field">title · status · due_at</text></g>
<g transform="translate(1184 636)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">student_suggestions</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan></text><text x="18" y="92" class="field">reference (unique) · access_code_hash</text><text x="18" y="115" class="field">title · description · status · created_at</text></g>
<g transform="translate(1184 856)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 13 0"/><text x="18" y="29" class="thead">suggestion_updates</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  suggestion_id</tspan></text><text x="18" y="92" class="field"><tspan class="key">FK</tspan><tspan>  author_user_id (nullable)</tspan></text><text x="18" y="115" class="field">author_label · message · created_at</text></g>
<g transform="translate(1184 1076)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 0 13"/><text x="18" y="29" class="thead">surveys</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  created_by</tspan></text><text x="18" y="92" class="field">title · question · options_json</text><text x="18" y="115" class="field">is_published · closes_at · created_at</text></g>
<g transform="translate(1184 1296)"><rect class="card" width="420" height="180"/><path class="head" d="M13 0 H407 Q420 0 420 13 V44 H0 V13 Q0 0 0 13"/><text x="18" y="29" class="thead">survey_responses</text><text x="18" y="69" class="field"><tspan class="key">PK</tspan><tspan>  id</tspan><tspan dx="18" class="key">FK</tspan><tspan>  survey_id</tspan></text><text x="18" y="92" class="field">respondent_hash · answer · comment</text><text x="18" y="115" class="field">unique (survey_id, respondent_hash)</text></g>
<text x="64" y="1540" class="note">Arrows point from a referenced parent table to a table that stores its foreign key. Some secondary foreign keys are listed inside the table cards.</text>
<text x="64" y="1564" class="note">Nullable fields are marked where relevant. The schema also stores audit and workflow history; no student identity table is present.</text>
</svg>
