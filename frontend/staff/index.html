<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff – Saagi SyncCampus</title><meta name="theme-color" content="#7A1426">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/assets/icons/icon.svg"><link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
</head><body>
<header class="top">
  <a class="brand" href="/staff/"><span class="logo"><img src="/assets/logo.png" alt="ISBAT University"></span>
    <span><b>Saagi SyncCampus</b><small>Guild leadership</small></span></a>
  <nav>
    <a href="/staff/" class="active">Dashboard</a>
    <a href="/staff/workspace.html" id="workspaceLink" class="hide">Guild workspace</a>
    <span id="who" class="who hide"></span>
    <button class="link hide" id="logout">Sign out</button>
  </nav>
</header>
<main>
  <section id="loginBox" class="card narrow">
    <h2>Staff sign in</h2>
    <p class="sub">For the Guild President, Vice, ministers and GRC delegates.</p>
    <form id="loginForm">
      <label>Email</label><input name="email" type="email" required autocomplete="username">
      <label>Password</label><input name="password" type="password" required autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
    <p class="muted small">Students do not need an account. <a class="more" href="/">Go to the student site</a></p>
  </section>
  <section id="invitationBox" class="card narrow hide"></section>
  <div id="app" class="hide"></div>
</main>
<script src="/js/common.js"></script><script src="/js/staff.js"></script>
</body></html>
