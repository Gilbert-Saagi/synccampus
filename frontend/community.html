<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guild updates – Saagi SyncCampus</title><meta name="theme-color" content="#7A1426">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/assets/icons/icon.svg"><link rel="stylesheet" href="/css/app.css">
</head><body data-page="/community.html">
<div id="hdr"></div>
<main class="page wide">
  <h1>Guild updates and student voice</h1>
  <p class="lead">Read announcements and events, share an idea with the Guild, or answer an open survey. No account or email address is needed.</p>

  <div class="grid2">
    <section class="card">
      <h2>Submit a suggestion</h2>
      <form id="suggestForm">
        <label>Title</label><input name="title" required minlength="5" maxlength="200">
        <label>Your idea</label><textarea name="description" required minlength="10" maxlength="5000"></textarea>
        <button class="btn">Submit anonymously</button>
      </form>
      <div id="suggestResult"></div>
    </section>
    <section class="card">
      <h2>Track a suggestion</h2>
      <form id="trackSuggestion">
        <label>Reference</label><input name="reference" required placeholder="SG-XXXXXX">
        <label>Private access code</label><input name="access_code" required autocomplete="off" placeholder="XXXX-XXXX-XXXX">
        <button class="btn alt">View status and replies</button>
      </form>
      <div id="suggestTrackResult"></div>
    </section>
  </div>

  <section id="surveys" class="card"><h2>Open surveys</h2><p class="muted">Loading…</p></section>
  <section id="guildUpdates" class="card"><h2>Announcements, events and media</h2><p class="muted">Loading…</p></section>
</main>
<div id="ftr"></div>
<script src="/js/common.js"></script><script src="/js/community.js"></script>
</body></html>
